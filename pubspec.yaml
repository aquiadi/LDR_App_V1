name: ldr_app
description: "A daily emotional ritual app for long-distance couples."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State Management & DI
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.3

  # Backend & Realtime
  supabase_flutter: ^2.5.0

  # UI & Styling
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  fl_chart: ^0.66.0

  # Utility
  cupertino_icons: ^1.0.8
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # Sora and Inter are bundled rather than fetched at runtime; see
    # AppTypography for why. google_fonts resolves these by filename.
    - assets/google_fonts/
